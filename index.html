<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Birla BOMIS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/birla_open_minds_logo.png" />
    <link rel="shortcut icon" type="image/png" href="/birla_open_minds_logo.png" />
    <link rel="apple-touch-icon" href="/birla_open_minds_logo.png" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Birla Institute IT Helpdesk</title>
    <meta name="description" content="A comprehensive IT command center for managing assets, tickets, rooms, AI-powered IT troubleshooting, and Birla Institute CCTV dynamic attendance monitoring." />
    <meta property="og:title" content="Birla Institute IT Helpdesk" />
    <meta property="og:description" content="A comprehensive IT command center for managing assets, tickets, rooms, AI-powered IT troubleshooting, and Birla Institute CCTV dynamic attendance monitoring." />
    <meta property="og:type" content="website" />
    
    <!-- Safe Splash Screen Dismissal & Stale Chunk Recovery -->
    <script>
      (function() {
        window.__APP_MOUNTED__ = false;
        window.__BOOT_ERRORS__ = [];
        window.dismissSplashScreen = function(force) {
          try {
            if (!force && !window.__APP_MOUNTED__) return;
            var splash = document.getElementById('splash-screen');
            if (splash) {
              splash.style.transition = 'opacity 0.25s ease-out';
              splash.style.opacity = '0';
              splash.style.pointerEvents = 'none';
              setTimeout(function() {
                if (splash && splash.parentNode) {
                  splash.parentNode.removeChild(splash);
                }
              }, 250);
            }
          } catch(e) {}
        };
        // Unregister any stale service workers on preview/dev run.app domains so they never serve stale HTML/JS
        try {
          if (typeof location !== 'undefined' && (location.hostname.indexOf('run.app') !== -1 || location.hostname === 'localhost') && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister().catch(function(){}); });
            }).catch(function(){});
          }
        } catch(e) {}
        function cleanReload() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister().catch(function(){}); });
              }).catch(function(){});
            }
            if ('caches' in window) {
              caches.keys().then(function(ks) {
                return Promise.all(ks.map(function(k) { return caches.delete(k); }));
              }).finally(function() { window.location.reload(); });
              return;
            }
          } catch(e) {}
          window.location.reload();
        }
        // Auto-recover once if a stale cached HTML or outdated Vite dep fails module load
        function tryRecoverOnce(reason) {
          try {
            var msg = String(reason || '');
            if (msg && window.__BOOT_ERRORS__.indexOf(msg) === -1 && window.__BOOT_ERRORS__.length < 6) {
              window.__BOOT_ERRORS__.push(msg);
            }
            if (/dynamically imported module|Loading chunk|Importing a module script failed|Failed to fetch|MIME type|Unexpected token '<|Outdated Optimize Dep|504/i.test(msg)) {
              var key = 'bomis_chunk_recover_ts';
              var last = parseInt(sessionStorage.getItem(key) || '0', 10);
              if (!last || Date.now() - last > 15000) {
                sessionStorage.setItem(key, String(Date.now()));
                cleanReload();
              }
            }
          } catch(e) {}
        }
        window.addEventListener('error', function(ev) {
          if (!ev) return;
          var msg = ev.message || (ev.error && ev.error.message) || '';
          if (!msg && ev.target && ev.target.tagName) {
            msg = 'Failed to load ' + ev.target.tagName + ': ' + (ev.target.src || ev.target.href || '');
          }
          if (msg) tryRecoverOnce(msg);
        }, true);
        window.addEventListener('unhandledrejection', function(ev) {
          var reason = ev && ev.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg) tryRecoverOnce(msg);
        });
        // If React hasn't mounted after 18s, offer a visible Reload button + show any captured boot error
        setTimeout(function() {
          if (window.__APP_MOUNTED__) return;
          var splash = document.getElementById('splash-screen');
          if (splash) {
            var sub = splash.querySelector('.splash-subtitle');
            if (sub) sub.textContent = 'Taking longer than expected. Click below to refresh cleanly.';
            if (!document.getElementById('splash-reload-btn')) {
              var btn = document.createElement('button');
              btn.id = 'splash-reload-btn';
              btn.textContent = 'Reload Application';
              btn.style.cssText = 'margin-top:16px;padding:10px 20px;background:#ea580c;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;';
              btn.onclick = cleanReload;
              splash.appendChild(btn);
            }
            if (window.__BOOT_ERRORS__ && window.__BOOT_ERRORS__.length > 0 && !document.getElementById('splash-error-log')) {
              var errBox = document.createElement('pre');
              errBox.id = 'splash-error-log';
              errBox.textContent = window.__BOOT_ERRORS__.join('\n');
              errBox.style.cssText = 'margin-top:14px;max-width:460px;max-height:120px;overflow:auto;padding:10px 12px;background:rgba(15,23,42,0.08);color:#b91c1c;border-radius:8px;font-size:11px;text-align:left;white-space:pre-wrap;word-break:break-word;';
              splash.appendChild(errBox);
            }
          }
        }, 18000);
      })();
    </script>

    <!-- Instant Theme Match Script to Prevent White Flash -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem("santinostech_theme") || "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.addEventListener("DOMContentLoaded", () => {
              document.body.classList.add("dark");
            });
          }
        } catch (e) {}
      })();
    </script>

    <!-- Sleek Pre-Loader Styling -->
    <style>
      html, body {
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }
      html.dark, body.dark {
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        min-height: 100%;
      }
      
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      
      .splash-logo {
        width: 72px;
        height: 72px;
        margin-bottom: 16px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        animation: pulse-logo 2s infinite ease-in-out;
      }
      
      .splash-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 4px;
        color: #1e293b;
        text-align: center;
      }
      
      .splash-subtitle {
        font-size: 0.8rem;
        font-weight: 500;
        color: #64748b;
        margin-bottom: 24px;
        text-align: center;
      }
      
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #e2e8f0;
        border-top: 2px solid #4f46e5;
        border-radius: 50%;
        animation: spin-loader 0.8s linear infinite;
      }
      
      html.dark .splash-title {
        color: #f8fafc;
      }
      html.dark .splash-subtitle {
        color: #94a3b8;
      }
      html.dark .spinner {
        border-color: #334155;
        border-top-color: #6366f1;
      }
      
      @keyframes spin-loader {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash screen inside #root (automatically unmounted once React loads) -->
      <div id="splash-screen">
        <img src="/it_pwa_icon.png" alt="BOMIS IT Helpdesk" class="splash-logo" onerror="this.style.display='none'" />
        <div class="splash-title">BOMIS Helpdesk</div>
        <div class="splash-subtitle">Enterprise Command Center</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically dismiss splash screen once window finishes loading
      window.addEventListener("load", function() {
        if (typeof window.dismissSplashScreen === "function") {
          window.dismissSplashScreen();
        }
      });

      // Capture PWA installation prompt globally to trigger instantly on click
      window.deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent("pwa-prompt-available"));
      });
    </script>
  </body>
</html>
